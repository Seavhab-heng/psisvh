<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="apple-touch-icon" sizes="180x180" href="https://psisvh.vercel.app/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://psisvh.vercel.app/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://psisvh.vercel.app/favicon-16x16.png">
    
    <title>Paññāsāstra International School - Van Hong (PSIS VH)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'primary-blue': '#4F46E5',
                        'accent-yellow': '#FBBF24',
                        'safe-green': '#10B981',
                        'bg-light': '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .frame-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #ffffff;
            touch-action: none;
            border-radius: 12px;
            /* Stabilization: prevents shifting during capture */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
        }
        #uploadedImage {
            position: absolute;
            top: 0; left: 0;
            transform-origin: center center;
            cursor: move;
            will-change: transform;
        }
        #frameOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="font-sans bg-bg-light text-gray-800">

    <header class="sticky top-0 z-50 bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="https://psisvh.vercel.app/logo.png" alt="Logo" class="h-8" />
                <h1 class="text-xl font-bold text-gray-800">PSIS VH</h1>
            </div>
            <nav class="flex space-x-4 text-sm font-medium">
                <a href="#about" class="text-gray-600 hover:text-primary-blue">About</a>
                <a href="#programs" class="text-gray-600 hover:text-primary-blue">Programs</a>
                <a href="#campaign-frame-tool" class="bg-primary-blue text-white py-2 px-4 rounded-full shadow-md">Join Campaign</a>
            </nav>
        </div>
    </header>

    <section class="bg-primary-blue py-16 text-white text-center px-4">
        <h2 class="text-4xl sm:text-6xl font-extrabold mb-4"><span class="text-accent-yellow">Learn with Joy!</span></h2>
        <p class="text-xl opacity-90 max-w-2xl mx-auto">Nurturing children to grow with confidence and happiness.</p>
    </section>

    <section id="campaign-frame-tool" class="py-20 bg-gray-50 px-4">
        <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-2xl border-4 border-accent-yellow p-6 sm:p-10">
            <h2 class="text-2xl font-black text-center text-primary-blue mb-6 uppercase">Profile Frame</h2>
            
            <div class="frame-container border shadow-inner" id="canvasContainer">
                <img id="uploadedImage" draggable="false" src="" />
                <img id="frameOverlay" src="frame.png" alt="Frame" />
            </div>

            <div class="mt-8 space-y-4">
                <input type="file" accept="image/*" id="uploadInput" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-primary-blue file:text-white cursor-pointer"/>
                
                <button id="downloadBtn" class="w-full bg-safe-green text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-emerald-600 transition active:scale-95">
                    Download & Save
                </button>
            </div>

            <div class="mt-8 border-t pt-6 grid grid-cols-3 gap-3">
                <a href="#" id="shareTg" class="bg-[#0088cc] text-white py-2 rounded-lg text-[10px] font-bold text-center">Telegram</a>
                <a href="#" id="shareWa" class="bg-[#25D366] text-white py-2 rounded-lg text-[10px] font-bold text-center">WhatsApp</a>
                <a href="#" id="shareFb" class="bg-[#1877F2] text-white py-2 rounded-lg text-[10px] font-bold text-center">Facebook</a>
            </div>
        </div>
    </section>

    <footer class="py-10 bg-gray-900 text-white text-center text-xs opacity-50">
        <p>© 2025 PSIS VH - All Rights Reserved</p>
    </footer>

    <script>
        // AUTO-SCROLL ON LOAD
        window.addEventListener('load', () => {
            const target = document.getElementById('campaign-frame-tool');
            if (target) {
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 1000);
            }
        });

        // FRAME TOOL VARIABLES
        const uploadedImage = document.getElementById('uploadedImage');
        const canvasContainer = document.getElementById('canvasContainer');
        const uploadInput = document.getElementById('uploadInput');
        const downloadBtn = document.getElementById('downloadBtn');

        let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX = 0, startY = 0, initialDist = -1;

        uploadInput.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { uploadedImage.src = event.target.result; resetFrame(); };
            reader.readAsDataURL(e.target.files[0]);
        });

        function resetFrame() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
        function updateTransform() { uploadedImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }

        // Interaction Logic
        canvasContainer.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); } });
        window.addEventListener('mouseup', () => isDragging = false);

        canvasContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true; startX = e.touches[0].clientX - translateX; startY = e.touches[0].clientY - translateY;
            } else if (e.touches.length === 2) {
                initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: false });

        canvasContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX; translateY = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                scale *= (dist / initialDist); initialDist = dist;
            }
            updateTransform();
        }, { passive: false });

        // DOWNLOAD FIX FOR FACEBOOK/TELEGRAM + PANNING FIX
        downloadBtn.addEventListener('click', () => {
            if (!uploadedImage.src) return alert("Please upload a photo first!");
            
            // 1. LOCK SCROLL (Telegram/FB Panning Fix)
            const originalScrollBehavior = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto'; 
            
            downloadBtn.innerText = "Processing...";
            downloadBtn.disabled = true;

            const rect = canvasContainer.getBoundingClientRect();

            html2canvas(canvasContainer, { 
                useCORS: true, 
                scale: 2,
                width: rect.width,
                height: rect.height,
                // Precise coordinate lock
                x: window.scrollX + rect.left,
                y: window.scrollY + rect.top,
                scrollX: 0,
                scrollY: 0, 
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                // Restore scroll behavior
                document.documentElement.style.scrollBehavior = originalScrollBehavior;

                const base64Image = canvas.toDataURL("image/png");

                // UPLOAD TO PHP
                fetch('https://xau.news/psisvh/upload.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        window.location.href = data.url;
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(err => alert("Connection error to storage server."))
                .finally(() => {
                    downloadBtn.innerText = "Download & Save";
                    downloadBtn.disabled = false;
                });
            });
        });

        // Share links
        const pageUrl = encodeURIComponent(window.location.href);
        document.getElementById('shareTg').href = `https://t.me/share/url?url=${pageUrl}`;
        document.getElementById('shareWa').href = `https://wa.me/?text=${pageUrl}`;
        document.getElementById('shareFb').href = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;
    </script>
</body>
</html>
