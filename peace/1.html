<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSIS VH - Campaign Frame</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .frame-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #ffffff;
            touch-action: none;
            border-radius: 12px;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        #uploadedImage {
            position: absolute;
            top: 0; left: 0;
            transform-origin: center center;
            cursor: move;
            will-change: transform;
        }
        #frameOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        /* New Success Overlay */
        #downloadOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="downloadOverlay">
        <p class="mb-4 font-bold text-lg text-center">✅ Image Ready!</p>
        <img id="finalResult" class="max-w-full max-h-[60vh] rounded-lg shadow-2xl border-4 border-white mb-6">
        <p class="text-sm text-yellow-400 mb-6">👆 Long Press on the image and select "Save Image"</p>
        <button onclick="closeOverlay()" class="bg-white text-black px-6 py-2 rounded-full font-bold">Back to Edit</button>
    </div>

    <section id="campaign-frame-tool" class="py-10 px-4 max-w-lg mx-auto">
        <div class="bg-white rounded-3xl shadow-xl p-6 border-4 border-yellow-400">
            <h1 class="text-center font-black text-indigo-700 text-2xl mb-4 uppercase">Campaign Frame</h1>
            
            <div class="frame-container" id="canvasContainer">
                <img id="uploadedImage" src="" />
                <img id="frameOverlay" src="frame.png" />
            </div>

            <div class="mt-6 space-y-4">
                <input type="file" accept="image/*" id="uploadInput" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-6 file:rounded-full file:border-0 file:bg-indigo-600 file:text-white font-bold cursor-pointer"/>
                
                <button id="downloadBtn" class="w-full bg-green-500 text-white py-4 rounded-xl font-bold text-xl shadow-lg active:scale-95 transition-all">
                    Generate Photo
                </button>
            </div>
        </div>
    </section>

    <script>
        const uploadedImage = document.getElementById('uploadedImage');
        const canvasContainer = document.getElementById('canvasContainer');
        const uploadInput = document.getElementById('uploadInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadOverlay = document.getElementById('downloadOverlay');
        const finalResult = document.getElementById('finalResult');

        let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX = 0, startY = 0, initialDist = -1;

        // Image Upload
        uploadInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => { uploadedImage.src = ev.target.result; resetPos(); };
            reader.readAsDataURL(e.target.files[0]);
        };

        function resetPos() { scale = 1; translateX = 0; translateY = 0; update(); }
        function update() { uploadedImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }

        // Touch/Mouse Events
        canvasContainer.onmousedown = (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; };
        window.onmousemove = (e) => { if(isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; update(); } };
        window.onmouseup = () => isDragging = false;

        canvasContainer.ontouchstart = (e) => {
            if (e.touches.length === 1) {
                isDragging = true; startX = e.touches[0].clientX - translateX; startY = e.touches[0].clientY - translateY;
            } else if (e.touches.length === 2) {
                initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        };
        canvasContainer.ontouchmove = (e) => {
            if (isDragging && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX; translateY = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                scale *= (dist / initialDist); initialDist = dist;
            }
            update();
        };

        // NEW CAPTURE LOGIC (Fixes Telegram Move)
        downloadBtn.onclick = () => {
            if (!uploadedImage.src) return alert("Please upload a photo!");
            
            downloadBtn.innerText = "Processing...";
            downloadBtn.disabled = true;

            // Freeze scroll for Telegram stability
            const originalScroll = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto';

            const rect = canvasContainer.getBoundingClientRect();

            html2canvas(canvasContainer, {
                useCORS: true,
                scale: 3, // High quality
                width: rect.width,
                height: rect.height,
                x: window.scrollX + rect.left,
                y: window.scrollY + rect.top,
                scrollX: 0,
                scrollY: 0
            }).then(canvas => {
                document.documentElement.style.scrollBehavior = originalScroll;
                const base64Image = canvas.toDataURL("image/png");

                // Send to PHP storage
                fetch('https://xau.news/psisvh/upload.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Instead of redirecting away, we show it in an overlay
                        finalResult.src = data.url;
                        downloadOverlay.style.display = 'flex';
                    }
                })
                .finally(() => {
                    downloadBtn.innerText = "Generate Photo";
                    downloadBtn.disabled = false;
                });
            });
        };

        function closeOverlay() {
            downloadOverlay.style.display = 'none';
        }
    </script>
</body>
</html>
