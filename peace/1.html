<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSIS VH - Frame Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .frame-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #ffffff;
            touch-action: none;
            border-radius: 12px;
        }
        #uploadedImage {
            position: absolute;
            top: 0; left: 0;
            transform-origin: center center;
            will-change: transform;
        }
        #frameOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-lg mx-auto bg-white p-6 rounded-3xl shadow-xl">
        <div class="frame-container" id="canvasContainer">
            <img id="uploadedImage" draggable="false" src="" crossorigin="anonymous" />
            <img id="frameOverlay" src="frame.png" alt="Frame" crossorigin="anonymous" />
        </div>

        <div class="mt-6 space-y-4">
            <input type="file" accept="image/*" id="uploadInput" class="w-full text-sm text-gray-500"/>
            <button id="downloadBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">
                Download Photo
            </button>
        </div>
    </div>

    <script>
        const uploadedImage = document.getElementById('uploadedImage');
        const canvasContainer = document.getElementById('canvasContainer');
        const uploadInput = document.getElementById('uploadInput');
        const downloadBtn = document.getElementById('downloadBtn');

        let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX = 0, startY = 0;

        uploadInput.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { 
                uploadedImage.src = event.target.result; 
                // Important: Reset coordinates when new image loaded
                translateX = 0; translateY = 0; scale = 1;
                uploadedImage.style.transform = `translate(0px, 0px) scale(1)`;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Simplified Drag Logic
        canvasContainer.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; update(); } });
        window.addEventListener('mouseup', () => isDragging = false);

        // Touch for Mobile
        canvasContainer.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].clientX - translateX; startY = e.touches[0].clientY - translateY; });
        canvasContainer.addEventListener('touchmove', (e) => { if (isDragging) { translateX = e.touches[0].clientX - startX; translateY = e.touches[0].clientY - startY; update(); } });
        canvasContainer.addEventListener('touchend', () => isDragging = false);

        function update() { uploadedImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }

        // THE FIX FOR WHITE IMAGE
        downloadBtn.addEventListener('click', () => {
            if (!uploadedImage.src) return alert("Upload a photo!");

            downloadBtn.innerText = "Saving...";
            
            // Temporary fix for image shifting: reset scroll to top before capture
            window.scrollTo(0, 0);

            html2canvas(canvasContainer, {
                useCORS: true,        // Critical for white screen fix
                allowTaint: false,    // Critical for security
                scale: 2,             // High quality
                backgroundColor: "#ffffff", // Ensure no transparency gaps
                logging: true         // See errors in console
            }).then(canvas => {
                const base64Image = canvas.toDataURL("image/jpeg", 0.9);

                fetch('https://xau.news/psisvh/upload.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.url) window.location.href = data.url;
                })
                .catch(err => alert("Server error"));
            });
        });
    </script>
</body>
</html>
