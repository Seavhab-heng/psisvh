<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const uploadInput = document.getElementById('uploadInput');
  const uploadedImage = document.getElementById('uploadedImage');
  const canvasContainer = document.getElementById('canvasContainer');
  const downloadBtn = document.getElementById('downloadBtn');

  let scale = 1, rotation = 0;
  let isDragging = false;
  let startX = 0, startY = 0, translateX = 0, translateY = 0;
  
  // Touch variables
  let initialDist = -1;

  // 1. Handle Upload
  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      uploadedImage.src = event.target.result;
      // Reset positions for new image
      scale = 1;
      translateX = 0;
      translateY = 0;
      rotation = 0;
      updateTransform();
    };
    reader.readAsDataURL(file);
  });

  function updateTransform() {
    uploadedImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotation}deg)`;
  }

  // 2. Zoom (Mouse Wheel)
  canvasContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    scale = Math.min(Math.max(0.1, scale + delta), 5);
    updateTransform();
  }, { passive: false });

  // 3. Pan (Mouse Drag)
  canvasContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateTransform();
  });

  document.addEventListener('mouseup', () => isDragging = false);

  // 4. Mobile Touch (Pan & Pinch-to-Zoom)
  canvasContainer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX - translateX;
      startY = e.touches[0].clientY - translateY;
    } else if (e.touches.length === 2) {
      initialDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });

  canvasContainer.addEventListener('touchmove', (e) => {
    e.preventDefault(); // Stop scrolling while adjusting photo
    if (isDragging && e.touches.length === 1) {
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
    } else if (e.touches.length === 2) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (initialDist > 0) {
        const zoomFactor = currentDist / initialDist;
        scale *= zoomFactor;
        initialDist = currentDist;
      }
    }
    updateTransform();
  }, { passive: false });

  canvasContainer.addEventListener('touchend', () => {
    isDragging = false;
    initialDist = -1;
  });

  // 5. Download (Crop & Save)
  downloadBtn.addEventListener('click', () => {
    // We target the container to "crop" anything outside its borders
    html2canvas(canvasContainer, {
      useCORS: true,
      scale: 2, // High definition
      backgroundColor: null
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'campaign-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });
</script>
